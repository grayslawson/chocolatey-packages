name: Publish the package

# The feed holds the Chocolatey packages.  A package is built from a published
# Osprey release: by default the latest final release, or a version named by
# hand.
on:
  schedule:
    - cron: "53 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Release version to package (defaults to the latest final release)
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The upstream checkout lives outside the repository, so it cannot end
      # up in the feed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: grayslawson/osprey
          path: ${{ runner.temp }}/upstream
          ref: main
      - uses: NuGet/setup-nuget@v2
      - name: Find the release to package
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="$(curl -fsSL 'https://api.github.com/repos/grayslawson/osprey/releases?per_page=20' \
            | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin) if not r["draft"] and not r["prerelease"]]; print(rs[0]["tag_name"] if rs else "")')"
          if [ -z "$tag" ]; then
            echo 'No final release yet; the feed stays where it is.' >&2
            exit 0
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Build the package
        if: steps.release.outputs.version != ''
        run: ${{ runner.temp }}/upstream/scripts/sync-chocolatey-feed.sh ${{ runner.temp }}/upstream . "${{ steps.release.outputs.version }}"
      - name: Commit the package
        if: steps.release.outputs.version != ''
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'The feed already has this package.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: osprey ${{ steps.release.outputs.version }}"
          git push
